name: Build Principio Tablet Notifier APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/tablet-notifier/**'
      - '.github/workflows/build-principio-tablet-notifier-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and extract Android source
        working-directory: android/tablet-notifier
        run: |
          rm -rf source Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip.b64
          cat parts/part*.b64 > Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip.b64
          base64 --decode Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip.b64 > Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip
          unzip -t Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip
          mkdir source
          unzip -q Principio_Tablet_Notifier_Android_1.1.0_SOURCE.zip -d source
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > source/gradle.properties

      - name: Build debug APK
        working-directory: android/tablet-notifier/source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and prepare APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/tablet-notifier/source/app/build/outputs/apk/debug/app-debug.apk
          cp android/tablet-notifier/source/app/build/outputs/apk/debug/app-debug.apk Principio_Tablet_Notifier_1.1.0.apk
          sha256sum Principio_Tablet_Notifier_1.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Principio_Tablet_Notifier_1.1.0_APK
          path: Principio_Tablet_Notifier_1.1.0.apk
          if-no-files-found: error
          retention-days: 30

name: Principio Manager Frontend Build Result

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - '.github/workflows/principio-manager-frontend-build.yml'

permissions:
  contents: write

jobs:
  build-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract CP47 runner
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f ci/Principio_Manager_CI_BUILD_RUNNER_CP47.tgz
          echo "0386eb0d3d03370d1c3d87e7e95063552b3ecfe866e7967ab87d99f5675282d8  ci/Principio_Manager_CI_BUILD_RUNNER_CP47.tgz" | sha256sum -c -
          tar -xzf ci/Principio_Manager_CI_BUILD_RUNNER_CP47.tgz -C .

      - name: Setup Node
        id: node
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Bootstrap lockfile when absent
        id: lock
        if: steps.verify.outcome == 'success' && steps.node.outcome == 'success'
        continue-on-error: true
        working-directory: manager-staging/frontend-react
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Install exact dependency graph
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        working-directory: manager-staging/frontend-react
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and verify Vite production assets
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: manager-staging/frontend-react
        run: npm run release:build

      - name: Create verified Build Result
        id: result
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 tools/manager_ci_make_frontend_result.py

      - name: Upload Build Result
        if: steps.result.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Principio_Manager_FRONTEND_BUILD_RESULT
          path: |
            Principio_Manager_FRONTEND_BUILD_RESULT.tgz
            Principio_Manager_FRONTEND_BUILD_RESULT.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Write visible CI status
        if: always()
        run: |
          set -e
          mkdir -p build-status
          cat > build-status/latest.txt <<EOF
          commit=${GITHUB_SHA}
          verify=${{ steps.verify.outcome }}
          node=${{ steps.node.outcome }}
          lock=${{ steps.lock.outcome }}
          install=${{ steps.install.outcome }}
          build=${{ steps.build.outcome }}
          result=${{ steps.result.outcome }}
          EOF
          if [ -f Principio_Manager_FRONTEND_BUILD_RESULT.sha256 ]; then
            cp Principio_Manager_FRONTEND_BUILD_RESULT.sha256 build-status/frontend-result.sha256
          fi
          git config user.name "principio-manager-ci"
          git config user.email "actions@users.noreply.github.com"
          git add build-status
          git commit -m "CI: publish frontend build status" || true
          git push

      - name: Fail workflow when build result failed
        if: always()
        run: |
          test "${{ steps.result.outcome }}" = "success"

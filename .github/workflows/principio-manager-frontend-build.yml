name: Principio Manager Frontend Build Result

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/frontend_chunks/**'
      - '.github/workflows/principio-manager-frontend-build.yml'

permissions:
  contents: write

jobs:
  build-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified frontend handoff
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(find ci/frontend_chunks -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 8
          cat $(find ci/frontend_chunks -maxdepth 1 -type f -name 'part*' | sort -V) > /tmp/frontend-handoff.b64
          test "$(wc -c < /tmp/frontend-handoff.b64)" -eq 100248
          base64 -d /tmp/frontend-handoff.b64 > Principio_Manager_FRONTEND_BUILD_HANDOFF.tgz
          echo "965f28748c1d0aa7bb0ccc2b1d6d43abd36d3db88827f15c74b0cfff8d874b41  Principio_Manager_FRONTEND_BUILD_HANDOFF.tgz" | sha256sum -c -
          tar -xzf Principio_Manager_FRONTEND_BUILD_HANDOFF.tgz

      - name: Setup Node
        id: node
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Build frontend and evidence
        id: build
        if: steps.verify.outcome == 'success' && steps.node.outcome == 'success'
        continue-on-error: true
        working-directory: Principio_Manager_FRONTEND_BUILD_HANDOFF
        run: bash ./build_frontend.sh

      - name: Copy Build Result to repository root
        id: result
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cp Principio_Manager_FRONTEND_BUILD_HANDOFF/Principio_Manager_FRONTEND_BUILD_RESULT.tgz .
          cp Principio_Manager_FRONTEND_BUILD_HANDOFF/Principio_Manager_FRONTEND_BUILD_RESULT.sha256 .
          test -s Principio_Manager_FRONTEND_BUILD_RESULT.tgz
          test -s Principio_Manager_FRONTEND_BUILD_RESULT.sha256

      - name: Upload Build Result
        if: steps.result.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Principio_Manager_FRONTEND_BUILD_RESULT
          path: |
            Principio_Manager_FRONTEND_BUILD_RESULT.tgz
            Principio_Manager_FRONTEND_BUILD_RESULT.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Write visible CI status
        if: always()
        run: |
          set -e
          mkdir -p build-status
          cat > build-status/latest.txt <<EOF
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          verify=${{ steps.verify.outcome }}
          node=${{ steps.node.outcome }}
          build=${{ steps.build.outcome }}
          result=${{ steps.result.outcome }}
          EOF
          if [ -f Principio_Manager_FRONTEND_BUILD_RESULT.sha256 ]; then
            cp Principio_Manager_FRONTEND_BUILD_RESULT.sha256 build-status/frontend-result.sha256
          fi
          git config user.name "principio-manager-ci"
          git config user.email "actions@users.noreply.github.com"
          git add build-status
          git commit -m "CI: publish frontend build status" || true
          git push

      - name: Fail workflow when build result failed
        if: always()
        run: test "${{ steps.result.outcome }}" = "success"

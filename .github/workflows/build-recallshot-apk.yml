name: Build RecallShot Beta

on:
  push:
    branches: [recallshot-build]
    paths:
      - 'recallshot-ci/**'
      - '.github/workflows/build-recallshot-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'recallshot-ci/**'
      - '.github/workflows/build-recallshot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RecallShot source
        shell: bash
        run: |
          set -euo pipefail
          cat recallshot-ci/part-*.b64 | tr -d '[:space:]' | base64 --decode > recallshot-source.zip
          echo '58f2348d1363f30c567aa285566d4189aee0dfe0f58d38a3d9293875ded20904  recallshot-source.zip' | sha256sum -c -
          mkdir -p recallshot-android
          unzip -q recallshot-source.zip -d recallshot-android
          if [ -d recallshot-ci/overrides ]; then cp -R recallshot-ci/overrides/. recallshot-android/; fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list --channel=3 > /tmp/sdk-list.txt
          PLATFORM=$(awk -F'|' '/platforms;android-(37|[Cc]innamon)/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}' /tmp/sdk-list.txt)
          if [ -z "$PLATFORM" ]; then exit 1; fi
          BUILD_TOOLS=$(awk -F'|' '/build-tools;37\./ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' /tmp/sdk-list.txt | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then BUILD_TOOLS=$(awk -F'|' '/build-tools;36\./ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' /tmp/sdk-list.txt | sort -V | tail -1); fi
          sdkmanager --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        working-directory: recallshot-android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint release
        working-directory: recallshot-android
        run: gradle --no-daemon lintRelease --stacktrace

      - name: Build optimized beta
        working-directory: recallshot-android
        run: gradle --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify package and sizes
        working-directory: recallshot-android
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -f "$APK"
          test -f "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee release-badging.txt
          grep -q "package: name='com.recallshot.app'" release-badging.txt
          grep -q "targetSdkVersion:'37'" release-badging.txt
          ls -lh "$APK" "$AAB" | tee release-sizes.txt
          sha256sum "$APK" "$AAB" | tee release-sha256.txt

      - name: Upload beta release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RecallShot-0.2.2-beta-release
          path: |
            recallshot-android/app/build/outputs/apk/release/app-release-unsigned.apk
            recallshot-android/app/build/outputs/bundle/release/app-release.aab
            recallshot-android/release-badging.txt
            recallshot-android/release-sizes.txt
            recallshot-android/release-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RecallShot-build-reports
          path: |
            recallshot-android/app/build/reports/**
            recallshot-android/build/reports/**
          if-no-files-found: ignore

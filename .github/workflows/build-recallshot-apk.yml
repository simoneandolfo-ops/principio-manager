name: Build RecallShot APK

on:
  push:
    branches: [recallshot-build]
    paths:
      - 'recallshot-ci/**'
      - '.github/workflows/build-recallshot-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'recallshot-ci/**'
      - '.github/workflows/build-recallshot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RecallShot source
        shell: bash
        run: |
          set -euo pipefail
          cat recallshot-ci/part-*.b64 | tr -d '[:space:]' | base64 --decode > recallshot-source.zip
          echo '58f2348d1363f30c567aa285566d4189aee0dfe0f58d38a3d9293875ded20904  recallshot-source.zip' | sha256sum -c -
          mkdir -p recallshot-android
          unzip -q recallshot-source.zip -d recallshot-android
          if [ -d recallshot-ci/overrides ]; then cp -R recallshot-ci/overrides/. recallshot-android/; fi

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: RecallShot-current-source
          path: recallshot-android/**
          if-no-files-found: error
          retention-days: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list --channel=3 > /tmp/sdk-list.txt
          echo 'Android 17 SDK candidates:'
          grep -Ei 'platforms;android-(37|cinnamon)|build-tools;37' /tmp/sdk-list.txt || true
          PLATFORM=$(awk -F'|' '/platforms;android-(37|[Cc]innamon)/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}' /tmp/sdk-list.txt)
          if [ -z "$PLATFORM" ]; then
            echo 'No Android 17/Cinnamon Bun platform package was exposed by sdkmanager.'
            exit 1
          fi
          BUILD_TOOLS=$(awk -F'|' '/build-tools;37\./ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' /tmp/sdk-list.txt | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(awk -F'|' '/build-tools;36\./ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' /tmp/sdk-list.txt | sort -V | tail -1)
          fi
          echo "Installing platform: $PLATFORM"
          echo "Installing build tools: $BUILD_TOOLS"
          sdkmanager --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        working-directory: recallshot-android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: recallshot-android
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        working-directory: recallshot-android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK metadata, signature and checksum
        working-directory: recallshot-android
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.recallshot.app'" apk-badging.txt
          grep -q "targetSdkVersion:'37'" apk-badging.txt
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecallShot-0.1.0-debug-APK
          path: |
            recallshot-android/app/build/outputs/apk/debug/app-debug.apk
            recallshot-android/apk-badging.txt
            recallshot-android/apk-sha256.txt
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RecallShot-build-reports
          path: |
            recallshot-android/app/build/reports/**
            recallshot-android/build/reports/**
          if-no-files-found: ignore
